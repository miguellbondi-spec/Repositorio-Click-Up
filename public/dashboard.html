<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dashboard — ZacxOrg</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
<div class="app">
  <div id="sidebar-container"></div>
  <div class="main">
    <div class="topbar">
      <div class="topbar-title">Dashboard</div>
      <div class="topbar-actions">
        <span id="welcomeMsg" class="text-muted"></span>
      </div>
    </div>
    <div class="content">
      <div class="stats-grid" id="statsGrid">
        <div class="stat-card"><div class="stat-icon" style="background:#eef2ff"><svg viewBox="0 0 24 24" fill="none" stroke="#6366f1" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg></div><div class="stat-value" id="s-projects">—</div><div class="stat-label">Projetos</div></div>
        <div class="stat-card"><div class="stat-icon" style="background:#f0fdf4"><svg viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg></div><div class="stat-value" id="s-tasks">—</div><div class="stat-label">Tarefas</div></div>
        <div class="stat-card"><div class="stat-icon" style="background:#fff7ed"><svg viewBox="0 0 24 24" fill="none" stroke="#f97316" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/></svg></div><div class="stat-value" id="s-leads">—</div><div class="stat-label">Leads</div></div>
        <div class="stat-card"><div class="stat-icon" style="background:#f0fdf4"><svg viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg></div><div class="stat-value" id="s-income">—</div><div class="stat-label">Receita</div></div>
        <div class="stat-card"><div class="stat-icon" style="background:#fef2f2"><svg viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg></div><div class="stat-value" id="s-expense">—</div><div class="stat-label">Despesas</div></div>
        <div class="stat-card"><div class="stat-icon" style="background:#eef2ff"><svg viewBox="0 0 24 24" fill="none" stroke="#6366f1" stroke-width="2"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg></div><div class="stat-value" id="s-balance">—</div><div class="stat-label">Saldo Líquido</div></div>
      </div>

      <div class="grid-2 mb-6">
        <div class="card">
          <div class="card-header"><h2>Tarefas por Status</h2></div>
          <div class="card-body" style="height:200px"><canvas id="taskChart"></canvas></div>
        </div>
        <div class="card">
          <div class="card-header"><h2>Tarefas Recentes</h2><a href="/tasks.html" class="btn btn-outline btn-sm">Ver todas</a></div>
          <div id="recentTasks"></div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="/js/api.js"></script>
<script>
  requireAuth();
  document.getElementById('sidebar-container').innerHTML = renderSidebar('dashboard');
  const user = getUser();
  document.getElementById('welcomeMsg').textContent = `Olá, ${user?.name?.split(' ')[0] || 'usuário'}!`;

  API.get('/dashboard').then(d => {
    document.getElementById('s-projects').textContent = d.projects;
    document.getElementById('s-tasks').textContent = d.tasks;
    document.getElementById('s-leads').textContent = d.leads;
    document.getElementById('s-income').textContent = fmt(d.income);
    document.getElementById('s-expense').textContent = fmt(d.expense);
    document.getElementById('s-balance').textContent = fmt(d.balance);
    document.getElementById('s-balance').style.color = d.balance >= 0 ? '#22c55e' : '#ef4444';

    // Chart
    const statusMap = { BACKLOG:'Backlog',TODO:'A Fazer',IN_PROGRESS:'Em Progresso',IN_REVIEW:'Em Revisão',DONE:'Concluído',CANCELLED:'Cancelado' };
    const colors = ['#94a3b8','#3b82f6','#f59e0b','#8b5cf6','#22c55e','#ef4444'];
    const labels = d.tasksByStatus.map(s => statusMap[s.status] || s.status);
    const counts = d.tasksByStatus.map(s => s.count);
    new Chart(document.getElementById('taskChart'), {
      type: 'doughnut',
      data: { labels, datasets: [{ data: counts, backgroundColor: colors.slice(0, counts.length), borderWidth: 0 }] },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right', labels: { font: { size: 11 }, boxWidth: 12 } } } }
    });

    // Recent tasks
    const recentMap = { BACKLOG:'badge-backlog',TODO:'badge-todo',IN_PROGRESS:'badge-progress',IN_REVIEW:'badge-review',DONE:'badge-done',CANCELLED:'badge-cancelled' };
    const labelMap = { BACKLOG:'Backlog',TODO:'A Fazer',IN_PROGRESS:'Em Progresso',IN_REVIEW:'Em Revisão',DONE:'Concluído',CANCELLED:'Cancelado' };
    document.getElementById('recentTasks').innerHTML = d.recentTasks.length ? d.recentTasks.map(t => `
      <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 20px;border-bottom:1px solid #f1f5f9">
        <span style="font-size:.875rem">${t.title}</span>
        <span class="badge ${recentMap[t.status]}">${labelMap[t.status]||t.status}</span>
      </div>`).join('') : '<div class="empty"><p>Nenhuma tarefa</p></div>';
  }).catch(() => toast('Erro ao carregar dados', 'error'));
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ZacxOrg — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#6366f1" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M9 9h6M9 12h6M9 15h4"/></svg>
      <span>ZacxOrg</span>
    </div>

    <div class="auth-tabs">
      <button class="auth-tab active" onclick="showTab('login')">Entrar</button>
      <button class="auth-tab" onclick="showTab('register')">Criar conta</button>
    </div>

    <!-- LOGIN -->
    <form id="loginForm" onsubmit="doLogin(event)">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="loginEmail" placeholder="email@empresa.com" required>
      </div>
      <div class="form-group">
        <label>Senha</label>
        <input type="password" id="loginPassword" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center" id="loginBtn">Entrar</button>
    </form>

    <!-- REGISTER -->
    <form id="registerForm" class="hidden" onsubmit="doRegister(event)">
      <div class="form-group">
        <label>Nome completo</label>
        <input type="text" id="regName" placeholder="Seu nome" required>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="regEmail" placeholder="email@empresa.com" required>
      </div>
      <div class="form-group">
        <label>Senha</label>
        <input type="password" id="regPassword" placeholder="Mínimo 6 caracteres" required minlength="6">
      </div>
      <div class="form-group">
        <label>Empresa</label>
        <input type="text" id="regCompany" placeholder="Nome da sua empresa">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center" id="regBtn">Criar conta</button>
    </form>

    <div class="auth-demo">
      <strong>🚀 Acesso demo rápido:</strong>
      Email: demo@zacxorg.com<br>Senha: Demo@123
    </div>
  </div>
</div>
<script>
  if (localStorage.getItem('token')) window.location.href = '/dashboard.html';

  function showTab(tab) {
    document.querySelectorAll('.auth-tab').forEach((t,i) => t.classList.toggle('active', (tab==='login'&&i===0)||(tab==='register'&&i===1)));
    document.getElementById('loginForm').classList.toggle('hidden', tab !== 'login');
    document.getElementById('registerForm').classList.toggle('hidden', tab !== 'register');
  }

  async function doLogin(e) {
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    btn.textContent = 'Entrando...'; btn.disabled = true;
    try {
      const res = await fetch('/api/auth/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ email: document.getElementById('loginEmail').value, password: document.getElementById('loginPassword').value }) });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error);
      localStorage.setItem('token', data.token);
      localStorage.setItem('user', JSON.stringify(data.user));
      window.location.href = '/dashboard.html';
    } catch(err) {
      alert(err.message || 'Erro ao entrar');
      btn.textContent = 'Entrar'; btn.disabled = false;
    }
  }

  async function doRegister(e) {
    e.preventDefault();
    const btn = document.getElementById('regBtn');
    btn.textContent = 'Criando...'; btn.disabled = true;
    try {
      const res = await fetch('/api/auth/register', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ name: document.getElementById('regName').value, email: document.getElementById('regEmail').value, password: document.getElementById('regPassword').value, company: document.getElementById('regCompany').value }) });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error);
      localStorage.setItem('token', data.token);
      localStorage.setItem('user', JSON.stringify(data.user));
      window.location.href = '/dashboard.html';
    } catch(err) {
      alert(err.message || 'Erro ao criar conta');
      btn.textContent = 'Criar conta'; btn.disabled = false;
    }
  }
</script>
</body>
</html>

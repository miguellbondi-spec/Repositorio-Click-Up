<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CRM — ZacxOrg</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="app">
  <div id="sidebar-container"></div>
  <div class="main">
    <div class="topbar">
      <div class="topbar-title">CRM — Pipeline</div>
      <div class="topbar-actions">
        <button class="btn btn-outline btn-sm" onclick="setView('pipeline')" id="btnPipeline">Pipeline</button>
        <button class="btn btn-outline btn-sm" onclick="setView('table')" id="btnTable">Tabela</button>
        <button class="btn btn-primary" onclick="openModal()">+ Novo Lead</button>
      </div>
    </div>
    <div class="content">
      <div class="stats-grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:24px">
        <div class="stat-card"><div class="stat-icon" style="background:#eef2ff"><svg viewBox="0 0 24 24" fill="none" stroke="#6366f1" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/></svg></div><div class="stat-value" id="s-total">—</div><div class="stat-label">Total de Leads</div></div>
        <div class="stat-card"><div class="stat-icon" style="background:#f0fdf4"><svg viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/></svg></div><div class="stat-value" id="s-won">—</div><div class="stat-label">Leads Ganhos</div></div>
        <div class="stat-card"><div class="stat-icon" style="background:#fff7ed"><svg viewBox="0 0 24 24" fill="none" stroke="#f97316" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg></div><div class="stat-value" id="s-value">—</div><div class="stat-label">Valor Total</div></div>
      </div>

      <div id="pipelineView" class="pipeline"></div>
      <div id="tableView" class="hidden">
        <div class="card"><div class="table-wrap">
          <table><thead><tr><th>Nome</th><th>Empresa</th><th>Email</th><th>Status</th><th>Valor</th><th></th></tr></thead>
          <tbody id="leadsTable"></tbody></table>
        </div></div>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay hidden" id="modal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalTitle">Novo Lead</h2>
      <button class="modal-close" onclick="closeModal()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <form onsubmit="saveLead(event)">
      <input type="hidden" id="editId">
      <div class="grid-2">
        <div class="form-group"><label>Nome *</label><input id="lName" required placeholder="Nome do lead"></div>
        <div class="form-group"><label>Empresa</label><input id="lCompany" placeholder="Empresa"></div>
      </div>
      <div class="grid-2">
        <div class="form-group"><label>Email</label><input type="email" id="lEmail" placeholder="email@empresa.com"></div>
        <div class="form-group"><label>Telefone</label><input id="lPhone" placeholder="(11) 99999-9999"></div>
      </div>
      <div class="grid-2">
        <div class="form-group"><label>Status</label>
          <select id="lStatus">
            <option value="NEW">Novo</option><option value="CONTACTED">Contactado</option>
            <option value="QUALIFIED">Qualificado</option><option value="PROPOSAL">Proposta</option>
            <option value="NEGOTIATION">Negociação</option><option value="WON">Ganho</option><option value="LOST">Perdido</option>
          </select></div>
        <div class="form-group"><label>Valor (R$)</label><input type="number" id="lValue" placeholder="0.00" step="0.01"></div>
      </div>
      <div class="form-group"><label>Notas</label><textarea id="lNotes" placeholder="Observações..."></textarea></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline" onclick="closeModal()">Cancelar</button>
        <button type="submit" class="btn btn-primary" id="saveBtn">Salvar</button>
      </div>
    </form>
  </div>
</div>

<script src="/js/api.js"></script>
<script>
  requireAuth();
  document.getElementById('sidebar-container').innerHTML = renderSidebar('crm');

  const PIPELINE_STAGES = ['NEW','CONTACTED','QUALIFIED','PROPOSAL','NEGOTIATION','WON','LOST'];
  const STAGE_LABELS = {NEW:'Novo',CONTACTED:'Contactado',QUALIFIED:'Qualificado',PROPOSAL:'Proposta',NEGOTIATION:'Negociação',WON:'Ganho',LOST:'Perdido'};
  let leads = [], curView = 'pipeline';

  async function load() {
    leads = await API.get('/leads');
    document.getElementById('s-total').textContent = leads.length;
    document.getElementById('s-won').textContent = leads.filter(l => l.status === 'WON').length;
    document.getElementById('s-value').textContent = fmt(leads.reduce((s, l) => s + (l.value || 0), 0));
    if (curView === 'pipeline') renderPipeline(); else renderTable();
  }

  function renderPipeline() {
    document.getElementById('pipelineView').innerHTML = PIPELINE_STAGES.map(s => {
      const cols = leads.filter(l => l.status === s);
      return `<div class="pipeline-col">
        <div class="pipeline-col-header">${STAGE_LABELS[s]} <span style="color:#94a3b8">(${cols.length})</span></div>
        <div class="pipeline-cards">${cols.map(l => `
          <div class="pipeline-card" onclick="editLead(${l.id})">
            <div class="pipeline-card-name">${l.name}</div>
            <div class="pipeline-card-company">${l.company || '—'}</div>
            ${l.value ? `<div class="pipeline-card-value">${fmt(l.value)}</div>` : ''}
          </div>`).join('')}
        </div>
      </div>`;
    }).join('');
  }

  function renderTable() {
    document.getElementById('leadsTable').innerHTML = leads.length ? leads.map(l => `
      <tr>
        <td><strong>${l.name}</strong></td>
        <td class="text-muted">${l.company || '—'}</td>
        <td class="text-muted">${l.email || '—'}</td>
        <td>${statusBadge(l.status)}</td>
        <td>${l.value ? fmt(l.value) : '—'}</td>
        <td><button class="btn btn-outline btn-sm" onclick="editLead(${l.id})">Editar</button> <button class="btn btn-danger btn-sm" onclick="delLead(${l.id})">✕</button></td>
      </tr>`).join('') : '<tr><td colspan="6" style="text-align:center;color:#64748b;padding:40px">Nenhum lead</td></tr>';
  }

  function setView(v) {
    curView = v;
    document.getElementById('pipelineView').classList.toggle('hidden', v !== 'pipeline');
    document.getElementById('tableView').classList.toggle('hidden', v !== 'table');
    document.getElementById('btnPipeline').className = v==='pipeline' ? 'btn btn-primary btn-sm' : 'btn btn-outline btn-sm';
    document.getElementById('btnTable').className = v==='table' ? 'btn btn-primary btn-sm' : 'btn btn-outline btn-sm';
    if (v==='table') renderTable(); else renderPipeline();
  }

  function openModal() {
    document.getElementById('editId').value=''; document.getElementById('modalTitle').textContent='Novo Lead';
    ['lName','lCompany','lEmail','lPhone','lNotes'].forEach(id => document.getElementById(id).value='');
    document.getElementById('lStatus').value='NEW'; document.getElementById('lValue').value='';
    document.getElementById('modal').classList.remove('hidden');
  }

  function editLead(id) {
    const l = leads.find(x => x.id===id); if (!l) return;
    document.getElementById('editId').value=l.id; document.getElementById('modalTitle').textContent='Editar Lead';
    document.getElementById('lName').value=l.name; document.getElementById('lCompany').value=l.company||'';
    document.getElementById('lEmail').value=l.email||''; document.getElementById('lPhone').value=l.phone||'';
    document.getElementById('lStatus').value=l.status; document.getElementById('lValue').value=l.value||'';
    document.getElementById('lNotes').value=l.notes||'';
    document.getElementById('modal').classList.remove('hidden');
  }

  function closeModal() { document.getElementById('modal').classList.add('hidden'); }

  async function saveLead(e) {
    e.preventDefault();
    const id = document.getElementById('editId').value;
    const body = { name:document.getElementById('lName').value, company:document.getElementById('lCompany').value, email:document.getElementById('lEmail').value, phone:document.getElementById('lPhone').value, status:document.getElementById('lStatus').value, value:parseFloat(document.getElementById('lValue').value)||0, notes:document.getElementById('lNotes').value };
    const btn=document.getElementById('saveBtn'); btn.disabled=true; btn.textContent='Salvando...';
    try { if(id) await API.put(`/leads/${id}`,body); else await API.post('/leads',body); toast(id?'Lead atualizado!':'Lead criado!'); closeModal(); load(); }
    catch(err) { toast(err.message,'error'); }
    btn.disabled=false; btn.textContent='Salvar';
  }

  async function delLead(id) {
    if (!confirm('Deletar este lead?')) return;
    await API.del(`/leads/${id}`); toast('Lead removido!'); load();
  }

  load();
</script>
</body>
</html>
